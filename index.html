<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MangaTracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f12; --bg2:#13161b; --bg3:#1a1e25; --bg4:#20252e;
  --line:#ffffff12; --line2:#ffffff20; --line3:#ffffff30;
  --acc:#7c6af7; --acc2:#9d8fff;
  --txt:#e8eaf0; --txt2:#8a8fa8; --txt3:#555a70;
  --green:#3ecf8e; --amber:#f0a04b; --red:#e06b6b;
  --font:'JetBrains Mono',ui-monospace,monospace;
  --r:6px; --maxw:720px;
}
html,body{background:var(--bg);color:var(--txt);font-family:var(--font);font-size:13px;line-height:1.5;min-height:100vh}

/* ── Layout ── */
.topbar{background:var(--bg2);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px}
.logo{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt3);flex:1}
.logo span{color:var(--acc2)}
.sync-chip{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.06em;color:var(--txt3)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--txt3)}
.sync-dot.ok{background:var(--green)} .sync-dot.busy{background:var(--amber);animation:pulse 1s infinite} .sync-dot.err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.page{max-width:var(--maxw);margin:0 auto;padding:24px 20px}

/* ── Auth card ── */
.auth-wrap{max-width:360px;margin:60px auto}
.card{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:24px}
.card-title{font-size:13px;letter-spacing:.06em;color:var(--txt);margin-bottom:4px}
.card-sub{font-size:10px;color:var(--txt3);letter-spacing:.04em;margin-bottom:20px}
.field{margin-bottom:12px}
.flabel{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);display:block;margin-bottom:5px}
.finput{width:100%;background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r);padding:8px 10px;color:var(--txt);font-family:var(--font);font-size:12px;outline:none;transition:border-color .12s}
.finput:focus{border-color:var(--acc)}
.savebtn{width:100%;padding:10px;border-radius:var(--r);border:none;cursor:pointer;font-family:var(--font);font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:var(--acc);color:#fff;transition:opacity .12s;margin-top:4px}
.savebtn:hover{opacity:.85} .savebtn:disabled{opacity:.4;cursor:not-allowed}
.err-msg{font-size:10px;color:var(--red);margin-top:8px;letter-spacing:.04em;display:none}

/* ── Nav tabs ── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:20px;background:var(--bg2);border-radius:8px 8px 0 0;overflow:hidden}
.tab{flex:1;text-align:center;padding:9px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);cursor:pointer;border:none;background:none;font-family:var(--font);border-bottom:2px solid transparent;transition:all .12s;margin-bottom:-1px}
.tab:hover{color:var(--txt2)} .tab.active{color:var(--acc2);border-bottom-color:var(--acc)}

/* ── Panels ── */
.panel{display:none} .panel.active{display:block}

/* ── Library controls ── */
.libctrl{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.searchbox{flex:1;min-width:140px;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);padding:7px 10px 7px 32px;color:var(--txt);font-family:var(--font);font-size:12px;outline:none;transition:border-color .12s}
.searchbox:focus{border-color:var(--acc)}
.swrap{position:relative;flex:1;min-width:140px}
.swrap .si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--txt3);font-size:14px;pointer-events:none}
.fsel{background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);padding:6px 10px;color:var(--txt2);font-family:var(--font);font-size:11px;outline:none;cursor:pointer}

/* ── Entry grid ── */
.entry-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ecard{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;overflow:hidden;cursor:pointer;transition:border-color .12s}
.ecard:hover{border-color:var(--line3)}
.ecard-art{width:100%;aspect-ratio:3/4;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:32px;position:relative;overflow:hidden}
.ecard-art img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ecard-body{padding:9px}
.ecard-title{font-size:11px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.ecard-meta{font-size:9px;color:var(--txt3);margin-top:3px;letter-spacing:.04em}
.ecard-ch{font-size:12px;color:var(--acc2);margin-top:4px;letter-spacing:.04em}
.stag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;margin-top:3px;letter-spacing:.06em}
.stag-on{background:#7c6af718;color:var(--acc2);border:1px solid #7c6af730}
.stag-cook{background:#f0a04b14;color:var(--amber);border:1px solid #f0a04b28}
.stag-done{background:#ffffff08;color:var(--txt3);border:1px solid var(--line2)}
.stag-drop{background:#e06b6b14;color:var(--red);border:1px solid #e06b6b28}

/* ── Schedule ── */
.week-grid{display:flex;flex-direction:column;gap:0}
.day-block{border-bottom:1px solid var(--line)}
.day-head{padding:8px 0;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);display:flex;justify-content:space-between}
.day-today .day-head{color:var(--acc2)}
.day-entries{display:flex;flex-direction:column;gap:0}
.srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.srow:hover .srow-title{color:var(--acc2)}
.srow-art{width:28px;height:38px;border-radius:3px;background:var(--bg3);border:1px solid var(--line2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;overflow:hidden;position:relative}
.srow-art img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.srow-title{font-size:12px;color:var(--txt);flex:1;transition:color .1s;letter-spacing:.02em}
.srow-ch{font-size:11px;color:var(--txt3)}

/* ── Sites ── */
.site-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.site-card{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:12px}
.site-icon{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;margin-bottom:7px}
.site-name{font-size:11px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site-cnt{font-size:10px;color:var(--acc2);margin-top:4px}

/* ── Modal ── */
.modal-bg{display:none;position:fixed;inset:0;background:#00000099;z-index:100;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--bg);border:1px solid var(--line2);border-radius:10px;width:100%;max-width:420px}
.modal-header{display:flex;align-items:flex-start;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.modal-art{width:56px;height:76px;border-radius:5px;background:var(--bg3);border:1px solid var(--line2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;position:relative}
.modal-art img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.modal-info{flex:1;min-width:0}
.modal-title{font-size:14px;color:var(--txt);word-break:break-word}
.modal-site{font-size:10px;color:var(--txt3);margin-top:3px}
.modal-close{background:none;border:1px solid var(--line2);border-radius:var(--r);padding:4px 8px;color:var(--txt3);cursor:pointer;font-size:16px;flex-shrink:0}
.modal-close:hover{color:var(--txt2)}
.modal-body{padding:16px}
.mstat{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
.mstat-card{background:var(--bg2);border-radius:var(--r);padding:9px;border:1px solid var(--line)}
.mstat-label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);margin-bottom:3px}
.mstat-val{font-size:13px;color:var(--txt)}
.mtags{font-size:9px;color:var(--txt3);letter-spacing:.06em;margin-bottom:10px}
.mnotes{font-size:10px;color:var(--txt3);line-height:1.6;padding-top:10px;border-top:1px solid var(--line)}
.mact-row{display:flex;gap:6px;margin-bottom:12px}
.mact{flex:1;padding:7px;border-radius:var(--r);border:1px solid var(--line2);background:none;color:var(--txt2);font-family:var(--font);font-size:10px;letter-spacing:.06em;cursor:pointer;text-transform:uppercase;transition:all .12s}
.mact:hover{border-color:var(--line3);color:var(--txt)}
.mact.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.mact.primary:hover{opacity:.85}

/* ── Empty ── */
.empty{text-align:center;padding:60px 20px;color:var(--txt3);font-size:11px;letter-spacing:.06em}
.empty-icon{font-size:36px;margin-bottom:14px}

/* ── Toast ── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--line2);border-radius:var(--r);padding:8px 16px;font-size:10px;letter-spacing:.08em;color:var(--txt2);opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap;z-index:300}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Responsive ── */
@media(max-width:500px){
  .entry-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .page{padding:16px 12px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Manga<span>Tracker</span></div>
  <div class="sync-chip">
    <span class="sync-dot" id="sdot"></span>
    <span id="slabel">Not signed in</span>
  </div>
  <button class="savebtn" id="signout-btn" style="width:auto;padding:5px 12px;margin:0;display:none">Sign out</button>
</div>

<!-- Auth screen -->
<div class="page" id="auth-screen">
  <div class="auth-wrap">
    <div class="card">
      <div class="card-title">Sign in to your library</div>
      <div class="card-sub">Enter the same username and phrase-key you use in the extension.</div>
      <div class="field">
        <label class="flabel">Username</label>
        <input class="finput" id="auth-username" type="text" placeholder="your name" autocomplete="off">
      </div>
      <div class="field">
        <label class="flabel">Phrase-key</label>
        <input class="finput" id="auth-phrasekey" type="password" placeholder="easy to remember phrase" autocomplete="off">
      </div>
      <button class="savebtn" id="auth-btn">Sign in / Register</button>
      <div class="err-msg" id="auth-err"></div>
    </div>
    <div style="text-align:center;margin-top:16px;font-size:9px;color:var(--txt3);letter-spacing:.06em">
      Your data is stored under a secure hash of your credentials.<br>No email required.
    </div>
  </div>
</div>

<!-- Main app -->
<div class="page" id="main-screen" style="display:none">
  <div class="tabs">
    <button class="tab active" data-tab="library">Library</button>
    <button class="tab" data-tab="schedule">Schedule</button>
    <button class="tab" data-tab="sites">Sites</button>
  </div>

  <!-- Library -->
  <div class="panel active" id="tab-library">
    <div class="libctrl">
      <div class="swrap">
        <svg class="si" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="searchbox" id="lib-search" placeholder="Search titles, genres…" type="search">
      </div>
      <select class="fsel" id="lib-type">
        <option value="">All types</option>
        <option value="manhwa">Manhwa</option>
        <option value="manga">Manga</option>
        <option value="manhua">Manhua</option>
        <option value="anime">Anime</option>
      </select>
      <select class="fsel" id="lib-status">
        <option value="">All</option>
        <option value="following">Following</option>
        <option value="cooking">Cooking</option>
        <option value="completed">Completed</option>
        <option value="dropped">Dropped</option>
      </select>
    </div>
    <div class="entry-grid" id="lib-grid"></div>
  </div>

  <!-- Schedule -->
  <div class="panel" id="tab-schedule">
    <div class="week-grid" id="week-grid"></div>
  </div>

  <!-- Sites -->
  <div class="panel" id="tab-sites">
    <div class="site-grid" id="sites-grid"></div>
  </div>
</div>

<!-- Detail modal -->
<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal-inner"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── FIREBASE CONFIG — REPLACE THESE ─────────────────────────────────────────
const FB_API_KEY   = 'YOUR_API_KEY';
const FB_PROJECT   = 'YOUR_PROJECT_ID';
// ─────────────────────────────────────────────────────────────────────────────

const DAYS_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYS_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let _idToken = null;
let _entries = [];
let _search = '', _type = '', _status = '';

// ── Utils ────────────────────────────────────────────────────────────────────
function $(id){ return document.getElementById(id); }
function esc(s){ return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }
function chLbl(e){ return e.type === 'anime' ? 'ep.' : 'ch.'; }
function toast(msg, dur=2000){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),dur);
}
function setSyncStatus(state, label){
  const dot=$('sdot'), lbl=$('slabel');
  dot.className='sync-dot'+(state?' '+state:'');
  lbl.textContent=label;
}

// ── Auth (anonymous Firebase + passphrase hash) ───────────────────────────────
async function makeDocKey(username, phrase){
  const raw = `${username.toLowerCase().trim()}:${phrase.trim()}`;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,32);
}

async function firebaseAnonSignIn(){
  const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB_API_KEY}`,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({returnSecureToken:true})
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error?.message||'Auth failed');
  return d.idToken;
}

async function fsGet(docPath, token){
  const r = await fetch(
    `https://firestore.googleapis.com/v1/projects/${FB_PROJECT}/databases/(default)/documents/${docPath}`,
    { headers:{'Authorization':`Bearer ${token}`} }
  );
  if(r.status===404) return null;
  if(!r.ok) throw new Error(`Firestore error ${r.status}`);
  const doc = await r.json();
  try{ return JSON.parse(doc.fields?.data?.stringValue||'null'); }catch{ return null; }
}

async function signIn(){
  const username = $('auth-username').value.trim();
  const phrase   = $('auth-phrasekey').value.trim();
  const errEl    = $('auth-err');
  errEl.style.display = 'none';
  if(!username || !phrase){ errEl.textContent='Both fields required.'; errEl.style.display=''; return; }
  const btn = $('auth-btn');
  btn.disabled=true; btn.textContent='Signing in…';
  setSyncStatus('busy','Connecting…');
  try{
    _idToken = await firebaseAnonSignIn();
    const docKey = await makeDocKey(username, phrase);
    sessionStorage.setItem('mt_dockey', docKey);
    sessionStorage.setItem('mt_user', username);
    const remote = await fsGet(`mt_users/${docKey}`, _idToken);
    _entries = remote?.entries || [];
    setSyncStatus('ok', `Signed in as ${username}`);
    $('signout-btn').style.display='';
    $('auth-screen').style.display='none';
    $('main-screen').style.display='';
    renderAll();
  }catch(e){
    errEl.textContent = e.message;
    errEl.style.display='';
    setSyncStatus('err','Error');
  }
  btn.disabled=false; btn.textContent='Sign in / Register';
}

function signOut(){
  _idToken=null; _entries=[];
  sessionStorage.removeItem('mt_dockey');
  sessionStorage.removeItem('mt_user');
  setSyncStatus('','Not signed in');
  $('signout-btn').style.display='none';
  $('auth-screen').style.display='';
  $('main-screen').style.display='none';
}

// ── Render ───────────────────────────────────────────────────────────────────
function filtered(){
  return _entries.filter(e=>{
    if(_search){
      const q=_search.toLowerCase();
      if(!e.title.toLowerCase().includes(q) && !(e.tropes||[]).some(t=>t.toLowerCase().includes(q))) return false;
    }
    if(_type && e.type!==_type) return false;
    if(_status){
      if(_status==='following' && e.mode!=='following') return false;
      if(_status==='cooking'   && e.mode!=='cooking')   return false;
      if(_status==='completed' && e.status!=='completed') return false;
      if(_status==='dropped'   && e.status!=='dropped')   return false;
    }
    return true;
  });
}

function artSrc(e){ return e.imageData || e.image || ''; }
function artCard(e, size=120){
  const src = artSrc(e);
  const icons={manhwa:'📖',manga:'📚',manhua:'📕',anime:'🎬',webtoon:'🌐'};
  return src
    ? `<div class="ecard-art" style="font-size:${size/3.5|0}px"><img src="${esc(src)}" alt="" onerror="this.parentElement.innerHTML='${icons[e.type]||'📖'}'"></div>`
    : `<div class="ecard-art">${icons[e.type]||'📖'}</div>`;
}
function statusTag(e){
  if(e.status==='dropped')   return `<span class="stag stag-drop">dropped</span>`;
  if(e.mode==='cooking')     return `<span class="stag stag-cook">cooking</span>`;
  if(e.status==='completed') return `<span class="stag stag-done">completed</span>`;
  return `<span class="stag stag-on">following</span>`;
}

function renderLibrary(){
  const grid = $('lib-grid');
  const es = filtered();
  if(!es.length){
    grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="empty-icon">📚</div>${_entries.length?'No matches.':'Your library is empty.'}</div>`;
    return;
  }
  grid.innerHTML = es.map(e=>`
    <div class="ecard" data-id="${e.id}">
      ${artCard(e)}
      <div class="ecard-body">
        <div class="ecard-title">${esc(e.title)}</div>
        <div class="ecard-meta">${esc(e.type)}${e.tropes&&e.tropes.length?' · '+esc(e.tropes.slice(0,2).join(', ')):''}
        </div>
        <div class="ecard-ch">${chLbl(e)} ${e.chapter||0}</div>
        ${statusTag(e)}
      </div>
    </div>`).join('');
  grid.querySelectorAll('.ecard').forEach(c=>c.addEventListener('click',()=>openDetail(c.dataset.id)));
}

function renderSchedule(){
  const grid = $('week-grid');
  const today = new Date();
  let html='';
  for(let i=-2;i<=6;i++){
    const d=new Date(today); d.setDate(today.getDate()+i);
    const dayIdx=d.getDay();
    const releases=_entries.filter(e=>e.releaseDays&&e.releaseDays.includes(dayIdx)&&e.status!=='dropped');
    if(!releases.length) continue;
    const isToday=i===0, isPast=i<0;
    const dateStr=`${DAYS_FULL[dayIdx]} ${d.getDate()} ${d.toLocaleString('default',{month:'short'})}`;
    html+=`<div class="day-block${isToday?' day-today':''}">
      <div class="day-head"><span>${isToday?'Today — '+dateStr:dateStr}</span><span>${releases.length} release${releases.length!==1?'s':''}</span></div>
      <div class="day-entries">
        ${releases.map(e=>{
          const src=artSrc(e);
          const icons={manhwa:'📖',manga:'📚',manhua:'📕',anime:'🎬',webtoon:'🌐'};
          const artInner=src?`<img src="${esc(src)}" alt="" onerror="this.parentElement.innerHTML='${icons[e.type]||'📖'}'">`:icons[e.type]||'📖';
          return `<div class="srow" data-id="${e.id}">
            <div class="srow-art">${artInner}</div>
            <span class="srow-title">${esc(e.title)}</span>
            <span class="srow-ch">${chLbl(e)} ${e.chapter||0}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }
  if(!html) html=`<div class="empty"><div class="empty-icon">📅</div>No releases this week.</div>`;
  grid.innerHTML=html;
  grid.querySelectorAll('.srow').forEach(r=>r.addEventListener('click',()=>openDetail(r.dataset.id)));
}

function renderSites(){
  const grid=$('sites-grid');
  const map={};
  _entries.forEach(e=>{ if(!e.hostname) return; map[e.hostname]=(map[e.hostname]||0)+1; });
  const pal=[
    {bg:'#7c6af720',fg:'var(--acc2)'},{bg:'#3ecf8e20',fg:'var(--green)'},
    {bg:'#f0a04b20',fg:'var(--amber)'},{bg:'#e06b6b20',fg:'var(--red)'}
  ];
  const entries=Object.entries(map);
  if(!entries.length){ grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🌐</div>No sites yet.</div>`; return; }
  grid.innerHTML=entries.map(([host,cnt],i)=>{
    const c=pal[i%pal.length];
    return `<div class="site-card">
      <div class="site-icon" style="background:${c.bg};color:${c.fg}">${host.slice(0,2).toUpperCase()}</div>
      <div class="site-name">${esc(host)}</div>
      <div class="site-cnt">${cnt} title${cnt!==1?'s':''}</div>
    </div>`;
  }).join('');
}

function renderAll(){ renderLibrary(); renderSchedule(); renderSites(); }

// ── Detail modal ──────────────────────────────────────────────────────────────
function openDetail(id){
  const e=_entries.find(x=>x.id===id); if(!e) return;
  const src=artSrc(e);
  const icons={manhwa:'📖',manga:'📚',manhua:'📕',anime:'🎬',webtoon:'🌐'};
  const artEl=src
    ? `<div class="modal-art"><img src="${esc(src)}" alt="" onerror="this.parentElement.innerHTML='${icons[e.type]||'📖'}'"></div>`
    : `<div class="modal-art">${icons[e.type]||'📖'}</div>`;
  const relDays=e.releaseDays&&e.releaseDays.length?e.releaseDays.map(d=>DAYS_SHORT[d]).join(', '):'unknown';
  const lastRead=e.lastRead?new Date(e.lastRead).toLocaleDateString():'never';
  $('modal-inner').innerHTML=`
    <div class="modal-header">
      ${artEl}
      <div class="modal-info">
        <div class="modal-title">${esc(e.title)}</div>
        <div class="modal-site">${esc(e.hostname||'')} · ${esc(e.type)}</div>
      </div>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="mstat">
        <div class="mstat-card"><div class="mstat-label">Chapter</div><div class="mstat-val">${chLbl(e)} ${e.chapter||0}</div></div>
        <div class="mstat-card"><div class="mstat-label">Status</div><div class="mstat-val">${esc(e.mode==='cooking'?'cooking':e.status)}</div></div>
        <div class="mstat-card"><div class="mstat-label">Schedule</div><div class="mstat-val" style="font-size:10px">${esc(relDays)}</div></div>
        <div class="mstat-card"><div class="mstat-label">Last read</div><div class="mstat-val" style="font-size:11px">${lastRead}</div></div>
      </div>
      <div class="mtags">${esc((e.tropes||[]).join(', ')||'—')}</div>
      <div class="mact-row">
        ${e.url?`<button class="mact primary" id="m-open">Open site</button>`:''}
      </div>
      ${e.notes?`<div class="mnotes">${esc(e.notes)}</div>`:''}
    </div>`;
  $('modal-close')?.addEventListener('click',()=>$('modal-bg').classList.remove('open'));
  $('m-open')?.addEventListener('click',()=>window.open(e.url,'_blank'));
  $('modal-bg').classList.add('open');
}

// ── Events ────────────────────────────────────────────────────────────────────
$('auth-btn').addEventListener('click', signIn);
['auth-username','auth-phrasekey'].forEach(id=>{
  $(id).addEventListener('keydown',e=>{ if(e.key==='Enter') signIn(); });
});
$('signout-btn').addEventListener('click', signOut);
$('modal-bg').addEventListener('click',e=>{ if(e.target===$('modal-bg')) $('modal-bg').classList.remove('open'); });

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    $('tab-'+tab.dataset.tab).classList.add('active');
  });
});

$('lib-search').addEventListener('input',e=>{ _search=e.target.value; renderLibrary(); });
$('lib-type').addEventListener('change',e=>{ _type=e.target.value; renderLibrary(); });
$('lib-status').addEventListener('change',e=>{ _status=e.target.value; renderLibrary(); });
</script>
